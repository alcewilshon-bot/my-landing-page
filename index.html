<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিশেষ অফার! ৫০০$ গিফট কার্ড জয়ী হন</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        .badge {
            background: #ff4757;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        h1 {
            color: #2f3542;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #57606f;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .gift-box {
            font-size: 70px;
            margin: 10px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        .timer-box {
            background: #f1f2f6;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #ff4757;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-claim {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #2ed573, #26af5f);
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-claim:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.6);
        }
        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #a4b0be;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">সীমিত সময়ের অফার</span>
        <div class="gift-box">🎁</div>
        <h1>অভিনন্দন! আপনি নির্বাচিত হয়েছেন</h1>
        <p>এখনই নিচের বাটনে ক্লিক করে আপনার <strong>$500 Gift Card</strong> দাবি (Claim) করুন। অফারটি শেষ হওয়ার আগেই আপনার উপহারটি বুঝে নিন!</p>
        
        <div class="timer-box">
            অফারের সময় বাকি: <span id="timer">05:00</span> মিনিট
        </div>

        <!-- আপনার নির্দিষ্ট রিডাইরেক্ট লিঙ্কটি এখানে যুক্ত করা আছে -->
        <a href="https://www.profitableratecpmnetwork.com/cmi3xvw0a?key=b1ebdc9da83aafb03beb49efe4af9ac0" class="btn-claim" target="_blank">
            👉 CLAIM YOUR GIFT CARD NOW
        </a>

        <div class="footer-note">
            * কোনো প্রকার ফি ছাড়াই ফ্রিতে ক্লেইম করুন। শর্তাবলী প্রযোজ্য।
        </div>
    </div>

    <script>
        // ৫ মিনিটের কাউন্টডাউন টাইমার
        let duration = 300;
        const timerDisplay = document.getElementById('timer');

        const countdown = setInterval(() => {
            let minutes = Math.floor(duration / 60);
            let seconds = duration % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `${minutes}:${seconds}`;

            if (--duration < 0) {
                clearInterval(countdown);
                timerDisplay.textContent = "সময় শেষ!";
            }
        }, 1000);
    </script>

</body>
</html>
